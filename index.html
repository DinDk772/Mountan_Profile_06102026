<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Горный профиль Кыргызской Республики</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <h1 id="page-title">Горный профиль Кыргызской Республики</h1>
      </div>
    </header>

    <main class="container">
      <nav class="main-tabs" aria-label="Разделы дашборда">
        <button type="button" class="main-tab active" data-tab="data" aria-selected="true">
          Текущие данные
        </button>
        <button type="button" class="main-tab" data-tab="templates" aria-selected="false">
          План сбора показателей
        </button>
        <button type="button" class="main-tab" data-tab="registry" aria-selected="false">
          Справочник НП (≥1000 м)
        </button>
      </nav>

      <p class="intro" id="page-intro"></p>

      <div id="panel-data" class="tab-panel">
        <div id="sectors-root"></div>
      </div>

      <div id="panel-templates" class="tab-panel hidden" hidden>
        <div id="templates-summary" class="templates-summary"></div>
        <div id="templates-root"></div>
      </div>

      <div id="panel-registry" class="tab-panel hidden" hidden>
        <div id="registry-summary" class="registry-summary"></div>
        <div id="registry-filters" class="registry-filters"></div>
        <div id="registry-table-wrap" class="registry-table-wrap"></div>
        <div id="registry-pager" class="registry-pager"></div>
      </div>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel">
        <header class="modal-header">
          <h2 id="modal-title"></h2>
          <button type="button" class="icon-btn" data-close aria-label="Закрыть">&times;</button>
        </header>
        <div class="modal-filters">
          <label>
            Показатель
            <select id="f-indicator"></select>
          </label>
          <label>
            Год
            <select id="f-year-mode">
              <option value="compare">2023 и 2024</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025*</option>
            </select>
          </label>
          <label>
            Территория
            <select id="f-level">
              <option value="kr">Кыргызская Республика</option>
              <option value="oblast">Область</option>
              <option value="rayon">Район / город</option>
            </select>
          </label>
          <label id="wrap-oblast">
            Область
            <select id="f-oblast"></select>
          </label>
          <label id="wrap-rayon" class="hidden">
            Район
            <select id="f-rayon"></select>
          </label>
        </div>
        <div class="chart-wrap">
          <canvas id="detail-chart" aria-label="Диаграмма"></canvas>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p class="sources-heading">Источники данных</p>
      <ul class="sources-list" id="sources-list"></ul>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
